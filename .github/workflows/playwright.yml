name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  perf-smoke:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build, benchmark and enforce budget
        run: |
          bun run build
          bun run preview -- --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            PERF_RUN_ID=ci PERF_OUTPUT_DIR=perf-results PERF_SCENARIOS=medium,large,wide,hub,dense,incremental PERF_ITERATIONS=5 PERF_WARMUPS=1 bun perf/benchmark.mjs
          else
            PERF_RUN_ID=ci PERF_OUTPUT_DIR=perf-results bun run perf:smoke
          fi
          PERF_REPORT=perf-results/ci/baseline.json bun run perf:check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-smoke-report
          path: perf-results/ci/baseline.json
          retention-days: 30
