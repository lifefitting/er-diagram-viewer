name: deploy-pages

# 把 landing/ 与 SPA 构建产物（dist/）一起发布到 GitHub Pages。
# 站点布局：
#   /         → landing/index.html （产品宣传页）
#   /app/     → 已构建的 SPA       （真正的工具）
#
# 触发条件：
#   - main 分支 push（每次合并主线都重新发布）
#   - 手动触发（workflow_dispatch，方便回滚或在 tag 之外重新发布）
#
# 启用方法（一次性）：
#   GitHub repo → Settings → Pages → Source 选 "GitHub Actions"。
#   此 workflow 第一次成功跑完后，Pages URL 会出现在 Settings → Pages。
#
# 不会发布单文件 .html（er-diagram-viewer.html）。
# 那个走 release.yml（tag 触发，上传到 Release Assets 供下载）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的最小权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一份 pages 部署在跑；新触发会取消老的。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build SPA
        run: bun run build

      # 把 landing/ 放在 site/ 根，把 dist/ 放在 site/app/。
      - name: Assemble site/
        run: |
          mkdir -p site
          cp -R landing/. site/
          mkdir -p site/app
          cp -R dist/. site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
